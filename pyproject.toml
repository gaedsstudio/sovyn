[project]
name = "sovyn"
version = "0.1.0"
description = "An open-source terminal agent that turns repeated work into reusable workflows."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "SOVYN contributors" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
sovyn = "sovyn.cli:entrypoint"

[tool.setuptools.packages.find]
include = ["sovyn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
