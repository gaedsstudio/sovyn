[project]
name = "sovyn-training"
version = "0.1.0"
description = "Storage-efficient SOVYN QLoRA fine-tuning system."
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
qlora = [
    "accelerate>=0.34",
    "datasets>=2.21",
    "peft>=0.12",
    "transformers>=4.44",
    "trl>=0.10",
]
compression = ["zstandard>=0.23"]

[dependency-groups]
dev = [
    "basedpyright>=1.21",
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
sovyn-train = "sovyn_training.cli:app"

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportMissingReturnType = "error"
reportPrivateUsage = "error"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
    "D203",
    "D213",
    "CPY001",
    "FBT001",
    "FBT002",
    "FBT003",
    "TD002",
    "TD003",
    "FIX002",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "PLR2004", "SLF001", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
