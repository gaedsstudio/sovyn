model:
  id: "HuggingFaceTB/SmolLM2-135M-Instruct"
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"

training:
  epochs: 2
  batch_size: 1
  gradient_accumulation_steps: 16
  save_strategy: "steps"
  save_total_limit: 2
  save_optimizer_state: false
  resume_training: false
  max_seq_length: 2048

dataset:
  source: "training/data/samples.jsonl"
  streaming: true
  cache_tokenized: false
  max_samples:

storage:
  output_root: "training/outputs"
  adapter_name: "sovyn-qlora-v0.1"
  merge_model_after_training: false
  cleanup_temp: true
  required_disk_multiplier: 1.25

